<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>CUTROOM — Learn Film Editing</title>

<style>

.s{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--pn);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}

a{color:var(--ac)}label{display:flex;gap:10px;align-items:flex-start;margin:8px 0}

</style></head><body><nav id="nav"></nav><main id="app"></main>
<script>
// ===== DATA (add modules/lessons here; UI is fully data-driven) =====
// lesson: [id,title,skill,concept,why,how,practice,mistakes,tip,question,options,answerIndex,tool]
const MODS=[
{id:0,t:"Understanding Film Editing",d:"What editing is and the vocabulary you need.",L:[
["m0l1","What is film editing?","storytelling","Editing is choosing which pieces of footage the audience sees, in what order, and for how long. A film is built in the edit, not just captured on set.","Two identical shots in a different order can create a different meaning. Editors control meaning, emotion and attention.","1) Look at the raw material. 2) Decide what each moment must communicate. 3) Select, order and time the shots to deliver it.","Watch any 1-minute scene twice. Write down every cut (a change of shot) and guess why it happened there.","Thinking editing means 'adding effects'. Effects decorate; decisions tell the story.","Editors are often called invisible artists: the best edit is felt, not noticed.","A man smiles, then we see a gun. Reverse the order (gun, then smile). What changes?",["Nothing, same shots","The smile reads as menacing instead of friendly","Only the music changes"],1,"any"],
["m0l2","Shot, take, scene, sequence","film structure","Shot: continuous footage from one camera start to stop. Take: one attempt at a shot. Scene: action in one place and time. Sequence: several scenes forming one dramatic unit.","You will describe footage to directors and other editors all day. Shared words prevent costly mistakes.","Hierarchy: Frame < Shot < Scene < Sequence < Film. Each shot may have many takes; you choose the best take.","Pick any film moment. Name one shot, the scene it sits in, and the sequence it belongs to.","Using 'scene' and 'shot' interchangeably.","Keep a notebook of terms in your own words; it beats memorising definitions.","A director filmed the same line 5 times from the same angle. These are five...",["Shots from one scene","Takes of one shot","Sequences"],1,"any"],
["m0l3","How editing controls attention","storytelling","Audiences look where the cut sends them. A close-up says 'this matters', a wide says 'here is the world'.","Attention is the editor's currency. Direct it deliberately and the audience follows the story effortlessly.","Ask: what should the viewer look at, feel, and know right now? Choose the shot that serves that.","Take a photo-based sequence of 3 images (phone gallery). Order them in two ways and note the different story.","Showing everything at once, so nothing stands out.","Cut to what the character is looking at: audiences instinctively want to see it too.","A character stares offscreen. Next you cut to a ticking bomb. The audience concludes...",["The character sees the bomb","The bomb is far away","Nothing"],0,"any"],
["m0l4","Frame, FPS, timeline","cutting","A frame is one still image. FPS (frames per second) is how many play each second: 24 is the film standard, 30 is common for video, 60 is smooth/sports. The timeline is where you arrange clips in time.","Frame rate affects motion feel and file compatibility. Mixed rates cause stutter.","Set your project's FPS to match your footage (check phone camera settings). Use the same rate across the project.","Check your phone's video setting. Record 5 seconds at 24 or 30 fps and note the look.","Mixing 24, 30 and 60 fps clips without knowing why they look different.","Shoot and edit in one frame rate unless you intentionally want slow motion.","A 60 fps clip in a 30 fps timeline can be played slowed to what speed for smooth slow motion?",["25%","50%","200%"],1,"any"],
["m0l5","Resolution and aspect ratio","film structure","Resolution is pixel count (1920x1080 = HD, 3840x2160 = 4K). Aspect ratio is width:height (16:9 landscape, 9:16 vertical, 2.39:1 cinematic).","The frame shape decides composition and where the video will be watched.","Choose the aspect ratio before you cut. Reframing later can crop faces and titles.","Try each shape below, then decide which suits a phone short vs a cinema film.","Exporting vertical video for a landscape platform with black bars.","Wider ratios feel epic; tall ratios feel intimate and personal.","Where does a 9:16 video mostly get watched?",["Cinema screens","Phones","Projectors only"],1,"capcut",true],
["m0l6","Codecs and file formats","professional workflow","A codec compresses video (H.264, H.265, ProRes). A format/container (.mp4, .mov) is the box that holds it.","Heavy codecs can make editing lag; proxies or the right export setting fix it.","Edit with what your software handles smoothly; export H.264 .mp4 for sharing; keep originals.","Look up the details of one of your clips (file info). Note its format, resolution and fps.","Deleting original footage after exporting.","Never edit the only copy of your footage.","What is .mp4?",["A codec","A container format","A resolution"],1,"any"]]},
{id:1,t:"Editing Fundamentals",d:"Your first edit in any software.",L:[
["m1l1","The editing interface","cutting","Every editor has: a media pool (your files), a viewer (preview), a timeline (sequence) and tools.","Knowing the layout means you stop hunting for buttons and start thinking about story.","Find these four areas in your software and say what each does out loud.","Open CapCut, DaVinci Resolve or Premiere and label the four areas on a screenshot.","Learning every button before cutting anything.","Learn tools just in time for the edit you are making.","Where do you arrange clips in time?",["Media pool","Viewer","Timeline"],2,"capcut"],
["m1l2","Importing and organising media","professional workflow","Bring footage in and sort it into named folders so you can find shots quickly.","Fast editors are organised editors. Searching costs creative energy.","Create folders: Footage, Audio, Music, Exports. Rename key clips with a short description.","Import 8 clips and rename each in plain language, e.g. 'wide-door-enter'.","Leaving everything named IMG_2043.","Name clips by what happens in them.","Why rename clips?",["To look neat","To find shots fast during the edit","It reduces file size"],1,"any"],
["m1l3","Cut, trim, split","cutting","Split divides a clip at the playhead. Trim shortens a clip's start or end. Cut often means any change from one shot to the next.","These three moves make up 90% of editing.","Place the playhead, split, delete what you do not need, then trim the edges to tighten.","Take a 30-second clip. Remove the first and last 5 seconds and one mistake in the middle.","Cutting on the exact action start, which feels abrupt; trim a few frames earlier.","Cut just before the movement peaks and let the next shot continue it.","You want to remove 3 seconds in the middle of a clip. You...",["Split twice, delete the middle, close the gap","Trim the end only","Change fps"],0,"capcut"],
["m1l4","Moving, ordering, deleting","cutting","Dragging clips reorders the story. Ripple delete closes the gap automatically.","Order is the story. Rearranging is the quickest way to test alternative meanings.","Drag clips to new positions and watch what changes. Use ripple delete to avoid gaps.","Make a 5-clip sequence, then rearrange it so it tells a different story.","Leaving black gaps in the timeline.","Try at least two orders before choosing one.","What does ripple delete do?",["Fades audio","Deletes and closes the gap","Splits a clip"],1,"capcut"],
["m1l5","Transitions, music, text, export","cutting","Transitions blend two shots. Music sets feeling. Text adds information. Export renders the final file.","Used well, they support the story; used badly, they distract.","Default to the plain cut. Add a dissolve only to show time passing. Lower music under dialogue. Export 1080p H.264 .mp4.","Make Project 1 (30-second sequence) with a cut-only version, then export it.","Using fancy transitions between every shot.","If you are unsure, use a straight cut.","Which transition should be your default?",["Spinning cube","Cut","Glitch"],1,"capcut"]]},
{id:2,t:"Cutting & Continuity",d:"Making cuts feel seamless.",L:[
["m2l1","Continuity and the 180° rule","continuity","Continuity makes separate shots feel like one continuous space. The 180° rule keeps the camera on one side of the action line so left/right stay consistent.","Cross the line and characters seem to swap sides, confusing the audience.","Imagine a line between two characters. Keep every camera angle on one side of it.","Sketch a two-person conversation and draw the line plus 3 legal camera positions.","Shooting both sides of the line without a neutral shot to bridge.","If you must cross the line, use a neutral shot or movement to reset the audience.","Two actors face each other. Camera A is on the left of their line, Camera B on the right. Cutting between them will...",["Look seamless","Make them appear to swap sides","Not matter"],1,"any"],
["m2l2","Match on action","continuity","Cut during a movement so the action continues in the next shot.","The movement hides the cut and the audience barely notices it.","Find a clear action (opening a door). Cut mid-motion to a different angle, overlapping by 2-3 frames.","Film someone sitting down from two angles. Cut during the sit.","Cutting before or after the action rather than during it.","Hide cuts inside movement.","Where is the best place to cut for match on action?",["Before the movement starts","During the movement","After it ends"],1,"capcut"],
["m2l3","Shot / reverse shot and eyelines","continuity","Alternating shots of two characters looking at each other, with matching eyelines.","The basis of almost every conversation scene.","Keep them looking in opposite directions (A left to right, B right to left).","Edit a short two-person conversation from two angles.","Both characters looking the same direction.","Hold on the listener when emotion matters more than words.","In shot/reverse shot, characters should look...",["The same direction","Opposite directions","At the camera"],1,"any"],
["m2l4","Cutaways, B-roll, jump and match cuts","storytelling","A cutaway shows something else related to the scene. B-roll is supporting footage. A jump cut skips time in the same shot. A match cut links two shots through shape, motion or idea.","They hide edits, add context, change pace or create meaning.","Cut away to cover a mistake. Use a jump cut deliberately for energy. For a match cut, find a similar shape in the next shot.","Cover a bad cut using B-roll, then make one match cut between two objects.","Using unrelated B-roll just to fill time.","B-roll should answer a question the viewer has.","Your interview has a long pause you want to hide. You...",["Add a cutaway of the subject's hands","Add a flashing transition","Zoom in"],0,"capcut"]]},
{id:3,t:"Storytelling Through Editing",d:"Emotion, tension and information.",L:[],o:["Editing for emotion","Editing for information","Tension & suspense","Comedy timing","Scene structure","Subtext through editing"]},
{id:4,t:"Pacing & Rhythm",d:"",L:[],o:["Pacing basics","Rhythm","Slow vs fast cutting","Holding shots"]},
{id:5,t:"Dialogue Editing",d:"",L:[],o:["Editing conversations","J-cuts and L-cuts","Overlapping dialogue","Choosing performances"]},
{id:6,t:"Sound Design",d:"",L:[],o:["Room tone","Foley","Sound bridges","Silence"]},
{id:7,t:"Music & Montage",d:"",L:[],o:["Cutting to rhythm","Montage theory","Time compression"]},
{id:8,t:"Color Correction & Grading",d:"",L:[],o:["Exposure","White balance","Correction ≠ grading","Matching shots"]},
{id:9,t:"Motion & Visual Effects",d:"",L:[],o:["Keyframes","Speed ramps","Masking","Green screen"]},
{id:10,t:"Advanced Story Editing",d:"",L:[],o:["Parallel editing","Non-linear time","Withholding information","Restructuring scenes"]},
{id:11,t:"Professional Workflow",d:"",L:[],o:["Selects & stringouts","Assembly to picture lock","Proxies","Delivery"]},
{id:12,t:"Final Short Film",d:"",L:[],o:["Capstone project"]}];
const SKILLS=["cutting","continuity","pacing","rhythm","storytelling","dialogue","sound","music","color","motion","vfx","compositing","film structure","professional workflow"];
const LV=["Basic","Intermediate","Advanced","Professional"];
const PROJ=[["p1","30-second sequence","Edit 8+ clips with cuts only, music and a title.",["Import and name clips","Rough order","Trim tight","Add music","Export"]],["p2","1-minute cinematic sequence","Use match on action and one cutaway.",["Plan shots","Assemble","Match on action","Cutaway","Export"]],["p3","Music montage","Cut to the beat.",["Pick track","Mark beats","Cut","Export"]],["p4","Simple dialogue scene","Shot/reverse shot with eyelines.",["Sync","Order","Eyelines","Reactions","Export"]]];
const STAGES=["Script","Shot list","Footage organisation","Selects","Assembly cut","Rough cut","Fine cut","Sound design","Color correction","Color grading","VFX","Final export"];
const PRACT=[["Beginner","Cut a 20-second clip down to 10","Remove dead time without losing meaning","Any phone clip","15 min","cutting","Story still makes sense; no jumps in action"],["Beginner","Reorder 6 clips two ways","Feel how order changes meaning","6 phone clips","20 min","storytelling","Two versions tell different stories"],["Intermediate","Match-on-action door scene","Hide the cut in movement","Two angles of someone entering","30 min","continuity","Cut is not noticeable"],["Advanced","Tension by timing alone","Build suspense using only shot length","Any 8 clips","45 min","pacing","Peers can identify the tense moment"]];
const SIM=[{s:"A character enters a dark room and notices an open window.",o:[["Wide shot","Establishes space, but drains focus from the character's discovery."],["Medium shot","Neutral and informative; good for orientation."],["Close-up of face","Prioritises emotion; the audience wonders what she sees."],["Reaction then window","Best for suspense: build anticipation, then reveal."]],b:3},{s:"Two friends argue. One says something cruel.",o:[["Stay on speaker","Shows intention but not impact."],["Cut to listener","Shows impact; the pause amplifies the emotion."],["Wide shot","Distances the audience."],["Cut to a door closing","Shifts focus away."]],b:1}];
const RES=[]; // add {type,title,url} here later
// ===== STATE =====
let S={xp:0,done:{},quiz:{},proj:{},fin:{},ans:{},streak:0,last:"",tool:"capcut",sim:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("cutroom")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("cutroom",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),ALL=MODS.flatMap(m=>m.L.map(l=>({m,l})));
const done=id=>!!S.done[id],cnt=m=>m.L.filter(l=>done(l[0])).length;
const modOpen=m=>m.L.length&&(m.id==0||(MODS[m.id-1].L.length&&cnt(MODS[m.id-1])==MODS[m.id-1].L.length));
const lessOpen=(m,i)=>modOpen(m)&&(i==0||done(m.L[i-1][0]));
const next=()=>ALL.find(({m,l})=>!done(l[0])&&lessOpen(m,m.L.indexOf(l)));
const sk=n=>{let c=ALL.filter(x=>x.l[2]==n&&done(x.l[0])).length+Object.values(S.proj).filter(v=>v).length*0;return Math.min(3,Math.floor(c/2)+(c?0:-1)+ (c>=1&&c<2?0:0))};
const lvl=n=>{let c=ALL.filter(x=>x.l[2]==n&&done(x.l[0])).length;return c==0?-1:Math.min(3,Math.floor((c-1)/1))};
const badges=()=>[["First Cut",cnt(MODS[1])>0],["Vocabulary Master",cnt(MODS[0])==MODS[0].L.length],["First Edit",cnt(MODS[1])==MODS[1].L.length],["Continuity Keeper",cnt(MODS[2])==MODS[2].L.length],["Project Finisher",Object.values(S.proj).some(p=>PROJ.some(q=>q[0]&&p&&p.length==q[3].length&&p.every(x=>x)))]];
function tick(){const t=new Date().toDateString();if(S.last!=t){const y=new Date(Date.now()-864e5).toDateString();S.streak=S.last==y?S.streak+1:1;S.last=t;save()}}
const total=ALL.length,pct=()=>Math.round(ALL.filter(x=>done(x.l[0])).length/total*100);
const tag=t=>t=="capcut"?'<span class="s ok">Learn this in CapCut</span>':'<span class="s">Principle: any software · refine in DaVinci Resolve / Premiere Pro</span>';
// ===== VIEWS =====
const V={
home:()=>`<div class="hero"><div class="s">Cutroom Film School</div><h1>LEARN TO EDIT. LEARN TO TELL STORIES.</h1><p>From your first cut to your first short film.</p><a class="b" href="#/lesson/${(next()||{l:["m0l1"]}).l[0]}">START LEARNING</a> <a class="b o" href="#/roadmap">VIEW ROADMAP</a></div><div class="g"><div class="card"><div class="big">13</div>Learning modules</div><div class="card"><div class="big">${total}+</div>Full lessons (more by data)</div><div class="card"><div class="big">11</div>Practical projects</div><div class="card"><div class="big">0→Pro</div>Beginner → Professional</div></div><p class="s">Principles first. Software second. You learn to decide, not just to click.</p>`,
dash:()=>{const n=next(),m=n?n.m:MODS[2];return`<div class="s">Welcome back</div><h1>Your Film Editing Journey</h1><div class="card"><div class="s">Level ${m.id} — ${m.t}</div><div class="big">${pct()}%</div><div class="bar"><i style="width:${pct()}%"></i></div><p>${ALL.filter(x=>done(x.l[0])).length} / ${total} lessons completed</p>${n?`<p>Next: <b>${n.l[1]}</b></p><a class="b" href="#/lesson/${n.l[0]}">CONTINUE LEARNING</a>`:`<p>All available lessons complete.</p>`}</div><div class="g"><div class="card"><div class="s">XP</div><div class="big">${S.xp}</div></div><div class="card"><div class="s">Streak</div><div class="big">${S.streak} d</div></div><div class="card"><div class="s">Skills unlocked</div><div class="big">${SKILLS.filter(x=>lvl(x)>=0).length}/14</div></div><div class="card"><div class="s">Projects</div><div class="big">${projDone()}</div></div></div><h2>Roadmap</h2>${roadmap()}`},
roadmap:()=>`<h1>Learning Roadmap</h1><p>Finish every lesson in a module to unlock the next.</p>${roadmap()}`,
module:id=>{const m=MODS[id];if(!m)return nf();return`<div class="s">Module ${m.id}</div><h1>${m.t}</h1><p>${m.d}</p>${m.L.length?m.L.map((l,i)=>`<div class="card ${lessOpen(m,i)?"":"lk"}"><span class="s">${done(l[0])?'<span class="ok">✓ Complete</span>':lessOpen(m,i)?"Unlocked":"🔒 Locked"}</span><h3>${i+1}. ${l[1]}</h3>${lessOpen(m,i)?`<a class="b" href="#/lesson/${l[0]}">${done(l[0])?"REVIEW":"OPEN"}</a>`:""}</div>`).join(""):`<div class="card"><p class="s">Lesson plan (content coming in a later release)</p>${m.o.map(x=>`<p>• ${x}</p>`).join("")}</div>`}`},
lesson:id=>{const f=ALL.find(x=>x.l[0]==id);if(!f)return nf();const {m,l}=f,i=m.L.indexOf(l);if(!lessOpen(m,i))return`<h1>Locked</h1><p>Complete the previous lesson first.</p><a class="b" href="#/module/${m.id}">BACK</a>`;
const a=S.ans[id],S2=(h,b)=>`<div class="sec"><div class="s">${h}</div><p>${b}</p></div>`;
const vis=l[13]?`<div class="sec"><div class="s">Visual example</div><div id="fr" class="frame" style="width:160px;height:90px">16:9</div>${["16:9","9:16","1:1","2.39:1"].map(r=>`<button class="o" onclick="ar('${r}')">${r}</button> `).join("")}</div>`:"";
return`<div class="s">${m.t} · Lesson ${i+1}/${m.L.length}</div><h1>${l[1]}</h1>${tag(l[12])}${S2("1 · Concept",l[3])}${S2("2 · Why it matters",l[4])}${vis}${S2("4 · How it works",l[5])}<div class="sec"><div class="s">5 · Watch / study</div><p class="s">Video slot — add resources in the Resource Library.</p></div>${S2("6 · Practice (+100 XP when done)",l[6])}<label><input type="checkbox" ${S.ans[id+"p"]?"checked":""} onchange="pr('${id}',this.checked)"> I did the practice task</label>${S2("8 · Common mistakes",l[7])}${S2("9 · Professional tip",l[8])}<div class="sec"><div class="s">7/10 · Checkpoint</div><p><b>${l[9]}</b></p>${l[10].map((o,j)=>`<button class="opt ${a!=null&&j==a?(a==l[11]?"r":"w"):""}" ${a==l[11]?"disabled":""} onclick="an('${id}',${j})">${o}</button>`).join("")}${a!=null?`<p>${a==l[11]?"Correct.":"Not quite. Think again and try another answer."}</p>`:""}</div>${done(id)?`<p class="ok">✓ Lesson complete</p>`:`<button ${a==l[11]?"":"disabled"} onclick="fin('${id}')">MARK LESSON COMPLETE</button><p class="s">${a==l[11]?"":"Answer the checkpoint correctly to unlock."}</p>`}`},
practice:()=>`<h1>Practice</h1>${["Beginner","Intermediate","Advanced"].map(g=>`<h2>${g}</h2>${PRACT.filter(p=>p[0]==g).map(p=>`<div class="card"><h3>${p[1]}</h3><p><b>Objective:</b> ${p[2]}<br><b>Footage:</b> ${p[3]}<br><b>Time:</b> ${p[4]}<br><b>Skill:</b> ${p[5]}<br><b>Success:</b> ${p[6]}</p></div>`).join("")}`).join("")}`,
projects:()=>`<h1>Projects</h1><p>Tick each step to progress. Finishing a project earns +500 XP.</p>${PROJ.map(p=>{const c=S.proj[p[0]]||[];return`<div class="card"><h3>${p[1]}</h3><p>${p[2]}</p>${p[3].map((s,i)=>`<label><input type="checkbox" ${c[i]?"checked":""} onchange="pj('${p[0]}',${i},this.checked)"> ${s}</label>`).join("")}<div class="bar"><i style="width:${Math.round(c.filter(x=>x).length/p[3].length*100)}%"></i></div></div>`}).join("")}<p class="s">Projects 5–11 (emotional, comedy, suspense, action, non-linear, 5-min and 8–10 min films) unlock with later modules.</p>`,
skills:()=>`<h1>Skill Tree</h1><div class="g">${SKILLS.map(n=>{const v=lvl(n);return`<div class="card ${v<0?"lk":""}"><div class="s">${n}</div><h3>${v<0?"Locked":"Level "+(v+1)+" — "+LV[v]}</h3><div class="bar"><i style="width:${(v+1)*25}%"></i></div></div>`}).join("")}</div>`,
quizzes:()=>{const qs=ALL.map(x=>x.l);return`<h1>Quizzes</h1><p>Editorial-thinking questions from the lessons you have unlocked.</p>${qs.filter(l=>done(l[0])).map(l=>`<div class="card"><p>${l[9]}</p>${l[10].map((o,j)=>`<button class="opt ${S.quiz[l[0]]!=null?(j==l[11]?"r":j==S.quiz[l[0]]?"w":""):""}" ${S.quiz[l[0]]!=null?"disabled":""} onclick="qz('${l[0]}',${j})">${o}</button>`).join("")}</div>`).join("")||`<div class="card">Nothing here yet. Complete a lesson to unlock its quiz.</div>`}<p>Score: ${Object.entries(S.quiz).filter(([k,v])=>ALL.find(x=>x.l[0]==k).l[11]==v).length}/${Object.keys(S.quiz).length}</p>`},
think:()=>`<h1>Think Like an Editor</h1>${SIM.map((q,i)=>`<div class="card"><p><b>${q.s}</b></p><p class="s">How would you cut this?</p>${q.o.map((o,j)=>`<button class="opt ${S.sim[i]!=null&&S.sim[i]==j?"r":""}" onclick="sm(${i},${j})">${o[0]}</button>`).join("")}${S.sim[i]!=null?`<p>${q.o[S.sim[i]][1]}${S.sim[i]==q.b?" ★ Strongest choice for this scene.":" Consider the alternative "+q.o[q.b][0]+"."}</p>`:""}</div>`).join("")}`,
final:()=>`<h1>Final Film Project</h1><p>Every stage from script to export. Finishing earns +2000 XP.</p><div class="card">${STAGES.map((s,i)=>`<label><input type="checkbox" ${S.fin[i]?"checked":""} onchange="fn(${i},this.checked)"> ${i+1}. ${s}</label>`).join("")}<div class="bar"><i style="width:${Math.round(STAGES.filter((s,i)=>S.fin[i]).length/STAGES.length*100)}%"></i></div></div>`,
profile:()=>`<h1>Progress</h1><div class="card"><div class="big">${S.xp} XP</div><p>${pct()}% complete · streak ${S.streak} days</p></div><h2>Badges</h2><div class="g">${badges().map(b=>`<div class="card ${b[1]?"":"lk"}">${b[1]?"🏅":"🔒"} ${b[0]}</div>`).join("")}</div>`,
resources:()=>`<h1>Resource Library</h1>${RES.length?RES.map(r=>`<div class="card"><span class="s">${r.type}</span><h3><a href="${r.url}" target="_blank" rel="noopener">${r.title}</a></h3></div>`).join(""):`<div class="card"><p>Empty for now. Add entries to the <code>RES</code> array: <code>{type:"video",title:"…",url:"…"}</code>. Types: tutorial, article, film example, footage, sfx, music, exercise.</p></div>`}`,
settings:()=>`<h1>Settings</h1><div class="card"><div class="s">Software track</div>${["capcut","davinci","premiere"].map(t=>`<label><input type="radio" name="t" ${S.tool==t?"checked":""} onchange="S.tool='${t}';save()"> ${t=="capcut"?"CapCut":t=="davinci"?"DaVinci Resolve":"Premiere Pro"}</label>`).join("")}</div><div class="card"><div class="s">Theme</div><button class="o" onclick="th('light')">Light</button> <button class="o" onclick="th('dark')">Dark</button></div><div class="card"><button class="o" onclick="if(confirm('Erase all progress?')){localStorage.removeItem('cutroom');location.reload()}">RESET PROGRESS</button></div>`};
const nf=()=>`<h1>Not found</h1><a class="b" href="#/dashboard">GO HOME</a>`;
const projDone=()=>PROJ.filter(p=>(S.proj[p[0]]||[]).filter(x=>x).length==p[3].length).length;
const roadmap=()=>MODS.map(m=>`<div class="card ${modOpen(m)?"":"lk"}"><span class="s">Module ${m.id} · ${m.L.length?cnt(m)+"/"+m.L.length+" lessons":m.o.length+" topics planned"}</span><h3>${modOpen(m)?"":"🔒 "}${m.t}</h3>${modOpen(m)?`<a class="b o" href="#/module/${m.id}">OPEN</a>`:""}</div>`).join("");
// ===== ACTIONS =====
const R=()=>{const h=(location.hash||"#/home").slice(2).split("/"),k=h[0]=="dashboard"?"dash":h[0];let f=V[k];let o;try{o=f?f(h[1]!=null&&k!="dash"?(k=="module"?+h[1]:h[1]):undefined):nf()}catch(e){o=`<h1>Something went wrong</h1><a class="b" href="#/home">HOME</a>`}
$("#app").innerHTML=o;scrollTo(0,0);$("#nav").innerHTML=[["home","Home"],["dashboard","Dash"],["roadmap","Path"],["practice","Practice"],["projects","Projects"],["skills","Skills"],["think","Think"],["quizzes","Quiz"],["final","Film"],["profile","Me"],["resources","Library"],["settings","Set"]].map(n=>`<a href="#/${n[0]}" class="${h[0]==n[0]?"on":""}">${n[1]}</a>`).join("");$("#nav").style.overflowX="auto"};
function an(id,j){S.ans[id]=j;save();R()}
function pr(id,v){if(v&&!S.ans[id+"p"])S.xp+=100;S.ans[id+"p"]=v;save()}
function fin(id){if(!done(id)){S.done[id]=1;S.xp+=50;tick();save()}const n=next();location.hash=n?"#/lesson/"+n.l[0]:"#/dashboard";R()}
function qz(id,j){S.quiz[id]=j;if(j==ALL.find(x=>x.l[0]==id).l[11])S.xp+=10;save();R()}
function sm(i,j){S.sim[i]=j;save();R()}
function pj(p,i,v){const c=S.proj[p]||[];const was=c.length&&c.filter(x=>x).length==PROJ.find(q=>q[0]==p)[3].length;c[i]=v;S.proj[p]=c;const n=PROJ.find(q=>q[0]==p)[3].length;if(!was&&c.filter(x=>x).length==n)S.xp+=500;save();R()}
function fn(i,v){const w=STAGES.every((s,k)=>S.fin[k]);S.fin[i]=v;if(!w&&STAGES.every((s,k)=>S.fin[k]))S.xp+=2000;save();R()}
function ar(r){const m={"16:9":[160,90],"9:16":[56,100],"1:1":[100,100],"2.39:1":[190,80]}[r];const f=$("#fr");f.style.width=m[0]+"px";f.style.height=m[1]+"px";f.textContent=r}
function th(t){document.documentElement.dataset.theme=t}
addEventListener("hashchange",R);R();
</script></body></html>
